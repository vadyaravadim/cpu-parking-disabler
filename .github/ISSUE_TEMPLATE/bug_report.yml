name: Bug report
description: The script failed, printed an error, or the settings did not apply / did not stick.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Not a bug:** no FPS change after unparking, or worse game performance on a 7900X3D / 7950X3D / 9900X3D / 9950X3D - both are explained in the [FAQ](https://github.com/vadyaravadim/cpu-parking-disabler#faq).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: status-output
    attributes:
      label: Output of -Status
      description: |
        Read-only, no admin prompt. It shows the script version, the CPU, the power scheme, the parked-core count and the four values, which answers most follow-up questions up front. If `-Status` itself fails, paste the error.
        - PowerShell Gallery: `cpu-parking-disabler -Status`
        - One-liner: `powershell -ExecutionPolicy Bypass -File "$env:USERPROFILE\cpu-parking-disabler.ps1" -Status`
        - ZIP / clone, from the script's folder: `powershell -ExecutionPolicy Bypass -File .\cpu-parking-disabler.ps1 -Status`
      render: text
    validations:
      required: true
  - type: textarea
    id: run-output
    attributes:
      label: Output of the run that went wrong
      description: Everything the script printed, including any red ERROR line. Skip it if the window closed before you could copy it, and say so above.
      render: text
  - type: dropdown
    id: launch-method
    attributes:
      label: How did you run it?
      description: Each method reaches the script through a different relaunch path, and that is where launch bugs live.
      options:
        - PowerShell Gallery (Install-Script)
        - irm | iex one-liner
        - Run.bat from the ZIP
        - .ps1 directly (clone or download)
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and display language
      description: Win+R, `winver`. The display language matters - `powercfg` output is localized.
      placeholder: Windows 11 24H2, build 26100.4061, German
    validations:
      required: true
