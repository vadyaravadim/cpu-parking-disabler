name: lint
on:
  push:
  pull_request:
  workflow_call:   # release.yml runs this as a gate before publishing
permissions:
  contents: read
jobs:
  psanalyzer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run PSScriptAnalyzer
        shell: pwsh
        env:
          PSSA_VERSION: '1.25.0'
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion $env:PSSA_VERSION -Force -Scope CurrentUser
          Import-Module PSScriptAnalyzer -RequiredVersion $env:PSSA_VERSION
          $issues = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $issues | Format-Table Severity, RuleName, ScriptName, Line, Message -AutoSize -Wrap
          foreach ($i in $issues) {
              $lvl = if ($i.Severity -eq 'Error') { 'error' } else { 'warning' }
              "::$lvl file=$($i.ScriptName),line=$($i.Line)::[$($i.RuleName)] $($i.Message)"
          }
          if ($issues) { throw "PSScriptAnalyzer found $($issues.Count) issue(s)" }
